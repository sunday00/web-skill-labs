<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <title>PK Contacts</title>
    <!-- materialize icons, css & js -->
    <link href="css/materialize.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet" type="text/css">
    <script src="js/materialize.min.js" type="text/javascript"></script>
    <link href="manifest.json" rel="manifest"/>

</head>
<body class="teal lighten-5">

<!-- top nav -->
<nav class="z-depth-0">
    <div class="nav-wrapper container">      
      <span class="left grey-text text-darken-1">
        <i class="material-icons sidenav-trigger" data-target="side-menu">menu</i>
      </span>
        <a class="right" href="/">PK<span>Contacts</span></a>
    </div>
</nav>

<!-- side nav -->
<ul class="sidenav side-menu" id="side-menu">
    <li><a class="subheader">PK Contacts</a></li>
    <li><a class="waves-effect" href="/">Home</a></li>
    <li><a class="waves-effect" href="pages/about.html">About</a></li>
</ul>

<!-- contacts -->
<div class="contacts container grey-text text-darken-1">
    <div class="grey-text text-darken-1 pk-contact">
        <div class="contact-image">
            <img alt="contact thumb" src="img/pkcontacts.png">
        </div>
        <div class="contact-details">
            <div class="contact-title">John Doe</div>
            <div class="contact-numbers">+130902092309</div>
        </div>
        <div class="contact-options">
            <i class="material-icons">call</i>
            <i class="material-icons">delete_outline</i>
        </div>
    </div>
    <div class="grey-text text-darken-1 pk-contact">
        <div class="contact-image">
            <img alt="contact thumb" src="img/pkcontacts.png">
        </div>
        <div class="contact-details">
            <div class="contact-title">John Doe</div>
            <div class="contact-numbers">+130902092309</div>
        </div>
        <div class="contact-options">
            <i class="material-icons">call</i>
            <i class="material-icons">delete_outline</i>
        </div>
    </div>
</div>

<div class="center">
    <a class="btn-floating btn-small btn-large add-btn sidenav-trigger" data-target="side-form">
        <i class="material-icons">add</i>
    </a>
</div>

<!-- add contact side nav -->
<div class="sidenav side-form" id="side-form">
    <form class="add-contact container section">
        <h6>New Contact</h6>
        <div class="divider"></div>
        <div class="input-field">
            <input class="validate" id="title" placeholder="e.g. John Doe" type="text">
            <label for="title">Contact Name</label>
        </div>
        <div class="input-field">
            <input class="validate" id="numbers" placeholder="e.g. +198392323" type="text">
            <label for="numbers">Number</label>
        </div>
        <div class="input-field center">
            <button class="btn-small">Add Contact</button>
        </div>
    </form>
</div>

<script src="js/common.js"></script>
<script src="js/app.js"></script>
</body>
</html>
