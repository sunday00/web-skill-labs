  attachPresign(input: AttachItem!): AttachPresignedRes!

  "\n## after uploaded file then persist data to currently ACTIVE IMAGE, TRANS VIDEO\n\n## bulk example\n\n```json     \nmutation AttachUploaded(\n  $input1: AttachUploadedInput!,\n  $input2: AttachUploadedInput!\n) {\n  AttachMutation {\n    q1: attachUploaded(input: $input1) {\n      item {\n       id\n      }\n      success\n    }\n    q2: attachUploaded(input: $input2) {\n      item {\n        id\n      }\n      success\n    }\n  }\n}\n\n{\n  \"input1\": {\n    \"id\": \"6a1e920a26255c9503a3a6ed\",\n    \"sizes\": [\n      {\n        \"name\": \"xs\",\n        \"wh\": [100, 200]\n      },\n      {\n        \"name\": \"lg\",\n        \"wh\": [800, 600]\n      },\n      {\n        \"name\": \"xl2\",\n        \"wh\": [1600, 300]\n      },\n    ]\n  },\n  \"input2\": {\n    \"id\": \"6a1e920a26255c9503a3a6ec\",\n    \"sizes\": [\n      {\n        \"name\": \"thumbnail\",\n        \"wh\": [100, 200]\n      }\n    ]\n  }\n}\n```  \n"
  attachUploaded(input: AttachUploadedInput!): IdResultResponse!
}

